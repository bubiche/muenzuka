# restic comes from Ubuntu (security fixes via apt; 0.18.1 on 26.04).
- name: restic is installed
  ansible.builtin.apt:
    name: restic
    state: present
    install_recommends: false

- name: rclone .deb is downloaded and verified
  ansible.builtin.get_url:
    url: "https://downloads.rclone.org/v{{ backup_rclone_version }}/rclone-v{{ backup_rclone_version }}-linux-amd64.deb"
    dest: "/var/cache/rclone-v{{ backup_rclone_version }}-linux-amd64.deb"
    checksum: "sha256:{{ backup_rclone_sha256 }}"
    mode: "0644"

- name: rclone is installed at the pinned version
  ansible.builtin.apt:
    deb: "/var/cache/rclone-v{{ backup_rclone_version }}-linux-amd64.deb"
  # A dry run doesn't download the file, so this can't be checked then.
  ignore_errors: "{{ ansible_check_mode }}"

# Secrets live here, root-only. The password itself is generated on the box
# and copied by hand to the break-glass sheet; it never enters git.
- name: /etc/restic exists (root only)
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: "0700"

# The restic password, from Ansible Vault. On this box it was generated by hand
# first; a dry run must report this task as "ok" (vault matches the file).
- name: restic password file
  ansible.builtin.copy:
    dest: /etc/restic/password
    owner: root
    group: root
    mode: "0600"
    content: "{{ vault_restic_password }}\n"
  no_log: true

# --- Nightly backup (phase 10) ------------------------------------------------
- name: /srv/files exists
  ansible.builtin.file:
    path: "{{ backup_documents_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Documents folder exists (Samba shares it in phase 11)
  ansible.builtin.file:
    path: "{{ backup_documents_path }}"
    state: directory
    owner: "{{ backup_documents_owner }}"
    group: "{{ backup_documents_owner }}"
    mode: "0750"

- name: restic cache folder (root only)
  ansible.builtin.file:
    path: /var/cache/restic
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Backup script is installed
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/backup.sh"
    dest: /usr/local/sbin/homelab-backup
    owner: root
    group: root
    mode: "0750"

- name: Manual restic helper is installed (homelab-restic critical|documents …)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/restic.sh"
    dest: /usr/local/sbin/homelab-restic
    owner: root
    group: root
    mode: "0750"

- name: Nightly backup (service)
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-backup.service
    mode: "0644"
    content: |
      # Managed by Ansible (homelab repo, role backup).
      [Unit]
      Description=Back up to Google Drive (restic critical, then documents)
      Wants=network-online.target
      After=network-online.target docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/homelab-backup
      # A first big documents upload can take many hours.
      TimeoutStartSec=20h
      Nice=10
      IOSchedulingClass=idle
  notify: daemon-reload

- name: Nightly backup (timer)
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-backup.timer
    mode: "0644"
    content: |
      # Managed by Ansible (homelab repo, role backup).
      # Persistent=true: if the box was off at 02:00, run soon after boot.
      [Unit]
      Description=Nightly backup at 02:00

      [Timer]
      OnCalendar={{ backup_oncalendar }}
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: daemon-reload

- name: Apply unit changes before enabling the backup timer
  ansible.builtin.meta: flush_handlers

- name: Backup timer is enabled
  ansible.builtin.systemd_service:
    name: homelab-backup.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
