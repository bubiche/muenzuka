# Compose stack in /opt/homelab (data folders live next to compose.yml there).
- name: /opt/homelab exists
  ansible.builtin.file:
    path: /opt/homelab
    state: directory
    owner: root
    group: root
    mode: "0755"

# compose.yml reads ${TS_FQDN} from here; it fails loudly if this is missing.
- name: Compose variables (.env)
  ansible.builtin.copy:
    dest: /opt/homelab/.env
    mode: "0644"
    content: |
      # Managed by Ansible (role docker, from the inventory).
      TS_FQDN={{ docker_ts_fqdn }}

# Immich's database password, from the Vault. A separate root-only file (not
# .env, which is 0644): compose passes it to the Immich server and Postgres only.
# Postgres reads it only when the database is first created (RUNBOOK → Immich).
- name: Immich secrets (immich.env)
  ansible.builtin.copy:
    dest: /opt/homelab/immich.env
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible (role docker, from the Vault).
      DB_PASSWORD={{ vault_immich_db_password }}
      POSTGRES_PASSWORD={{ vault_immich_db_password }}
  no_log: true

# Created before compose starts, so Docker doesn't make them root 0755.
# /opt/homelab/immich holds the live database (Postgres owns its own
# postgres/ folder; don't manage it here) and the nightly dumps.
- name: Immich folders (library, database, dumps) are private
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /srv/immich                  # the photo library (a copy; not backed up)
    - /opt/homelab/immich
    - /opt/homelab/immich/dumps    # scripts/backup.sh writes the database dumps here

- name: compose.yml from the repo
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../compose.yml"
    dest: /opt/homelab/compose.yml
    mode: "0644"

- name: Services are up
  community.docker.docker_compose_v2:
    project_src: /opt/homelab
    pull: missing
    remove_orphans: true
    state: present
  # In a dry run compose.yml isn't on the box yet.
  ignore_errors: "{{ ansible_check_mode }}"

# Vaultwarden's data (database, rsa_key.pem) is readable by root only.
- name: Vaultwarden data is private
  ansible.builtin.file:
    path: /opt/homelab/vaultwarden/data
    state: directory
    owner: root
    group: root
    mode: "0700"
