- name: update-grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

# ssh is socket-activated on 26.04: ssh.service is often not running, and it
# re-reads config when it next starts. Only reload it if it is running.
- name: reload sshd
  ansible.builtin.command: systemctl try-reload-or-restart ssh.service
  changed_when: true

- name: daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true
