[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
retry_files_enabled = False
# Ansible Vault password: on the Mac only (and the break-glass sheet), never in git.
vault_password_file = ~/.config/homelab/vault-pass

[privilege_escalation]
become = True
# The admin user's sudo password; there is no NOPASSWD rule on purpose.
become_ask_pass = True
